<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABC Engineering College</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 10px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #ffffff;
    }

    /* Navigation - 10% */
    .nav {
      background: #dbe6fb;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .nav h2 { margin: 0; font-weight: 500; font-size: 28px; color: #222; }
    .nav p  { margin: 4px 0 0; color: #4a5f8f; }

    /* Middle section: Left 25% + Right 75% */
    .container {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .left {
      width: 25%;
      background: #fae3c2;
      padding: 20px;
      border-radius: 10px;
    }
    .right {
      width: 75%;
      background: #dcf0d8;
      padding: 20px;
      border-radius: 10px;
    }
    .left h3, .right h3 { margin: 0 0 20px; color: #222; }
    .left p  { color: #6b5a3e; margin: 12px 0; }
    .right p { color: #4d6b4a; margin: 12px 0; }

    /* Footer - 10% */
    .footer {
      background: #e6dff5;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
    }
    .footer h3 { margin: 0; font-weight: 500; color: #222; }
    .footer p  { margin: 4px 0 0; color: #5b4b8a; }
  </style>
</head>
<body>

  <div class="nav">
    <h2>HOME | ABOUT | COURSES | ADMISSIONS | CONTACT</h2>
    <p>Navigation – 10%</p>
  </div>

  <div class="container">
    <div class="left">
      <h3>Departments</h3>
      <p>CSE</p>
      <p>ECE</p>
      <p>EEE</p>
      <p>Mechanical</p>
      <p>Left – 25%</p>
    </div>

    <div class="right">
      <h3>College Information</h3>
      <p>Welcome to ABC Engineering College</p>
      <p>Latest announcements</p>
      <p>Upcoming events and activities</p>
      <p>Right – 75%</p>
    </div>
  </div>

  <div class="footer">
    <h3>© 2026 ABC Engineering College</h3>
    <p>Footer – 10%</p>
  </div>

</body>
</html>
