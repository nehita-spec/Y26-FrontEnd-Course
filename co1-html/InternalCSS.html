<!DOCTYPE html>
<html>
<head>
    <title>Internal CSS Example</title>

    <style>
        body {
            background-color: rgb(251, 237, 240);
            font-family: Arial, sans-serif;
        }

        h1 {
            color: rgb(0, 0, 0);
            text-align: center;
        }

        h2 {
            color: brown;
        }

        p {
            color: rgba(0, 0, 139, 0.648);
            font-size: 18px;
        }

        button {
            background-color: rgb(182, 209, 252);
            color: rgb(0, 0, 0);
            padding: 10px 20px;
            border: none;
        }
    </style>
</head>

<body>

    <h1>Welcome to ABC College</h1>

    <h2>Department of Computer Science</h2>

    <p>
        We are learning Internal CSS in
        Full Stack Frontend Development.
    </p>

    <p>
        Internal CSS can style multiple elements
        within the same webpage.
    </p>

    <button>Learn More</button>

</body>
</html>
