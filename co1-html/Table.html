<!DOCTYPE html>
<html>
<head>
    <title>Styled Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;      /* light grey page background */
            margin: 30px;
        }

        h2 {
            color: #2c3e50;                 /* dark blue headings */
        }

        table {
            border-collapse: collapse;
            margin-bottom: 40px;
            background-color: white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);   /* soft shadow around table */
        }

        caption {
            padding: 8px;
            color: #555;
        }

        th, td {
            border: 1px solid #999;
            padding: 12px 25px;
            text-align: center;
        }

        th {
            background-color: #2c7da0;      /* blue header */
            color: white;
        }

        tbody tr:nth-child(even) {
            background-color: #eaf4f8;      /* alternate row colour */
        }

        tr:hover {
            background-color: #d6ecf3;      /* highlight row on mouse hover */
        }

        tfoot th {
            background-color: #1b4f6b;      /* darker blue for the total row */
        }
    </style>
</head>
<body>

    <h2>Student Details</h2>

    <table>
        <caption><b>Table Caption</b>: College Student Details</caption>
        <tr>
            <th>Department</th>
            <th>Student Name</th>
            <th>Year</th>
        </tr>

        <tr>
            <td rowspan="2">CSE</td>
            <td>Ravi</td>
            <td>II</td>
        </tr>

        <tr>
            <td>Sita</td>
            <td>III</td>
        </tr>

        <tr>
            <td>ECE</td>
            <td>Rahul</td>
            <td>II</td>
        </tr>
    </table>

    <h2>Sales Report</h2>

    <table>
        <thead>
            <tr>
                <th>Product</th>
                <th>Amount</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Laptop</td>
                <td>50000</td>
            </tr>

            <tr>
                <td>Mobile</td>
                <td>20000</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th>Total</th>
                <th>70000</th>
            </tr>
        </tfoot>
    </table>

</body>
</html>
