<!DOCTYPE html>
<html>
<head>
    <title>Inline CSS Example</title>
</head>
<body>

    <h1 style="color: rgb(156, 5, 5); text-align: center;">
        Welcome to ABC College
    </h1>

    <p style="color: rgb(0, 0, 0); font-size: 20px;">
        This paragraph uses inline CSS.
    </p>

    <h2 style="background-color: rgba(227, 123, 123, 0.849); padding: 10px;">
        Full Stack Frontend Development
    </h2>

    <button style="background-color: rgb(165, 202, 237);
                   color: black;
                   padding: 10px 20px;
                   border: none;">
        Click Me
    </button>

</body>
</html>
